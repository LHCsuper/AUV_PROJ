  <text x="490" y="82" text-anchor="middle" font-family="Microsoft YaHei, SimHei, Arial" font-size="15" fill="#475569">依据 Fossen 建模框架、AUV 轨迹跟踪综述与鲁棒控制相关文献重新绘制</text>
  <rect x="382" y="232" width="216" height="92" rx="14" fill="#0f766e"/>
