    <text x="505" y="208" text-anchor="middle" font-size="15" fill="#334155">ESO/ADRC</text>
    <text x="505" y="231" text-anchor="middle" font-size="15" fill="#334155">扰动补偿</text>
    <rect x="615" y="145" width="150" height="110" rx="12" fill="#fee2e2" stroke="#f87171"/>
    <text x="690" y="180" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">鲁棒控制</text>
    <text x="690" y="208" text-anchor="middle" font-size="15" fill="#334155">SMC/NTSM</text>
