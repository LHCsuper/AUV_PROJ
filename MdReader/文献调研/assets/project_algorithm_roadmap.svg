    <text x="875" y="231" text-anchor="middle" font-size="15" fill="#334155">约束优化</text>
    <rect x="250" y="345" width="480" height="68" rx="14" fill="#0f766e"/>
    <text x="490" y="374" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">最终交付：可操作 APP + 离线演示动画 + 控制算法模块</text>
