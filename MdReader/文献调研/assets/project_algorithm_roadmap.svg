  <text x="490" y="78" text-anchor="middle" font-family="Microsoft YaHei, SimHei, Arial" font-size="15" fill="#475569">综合路径跟随、抗扰控制、鲁棒非线性控制与 MPC 文献后形成的项目技术路线</text>
  <g font-family="Microsoft YaHei, SimHei, Arial">
